name: Windows
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: ./packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: win-thermalright-ai-monitor-windows-x64
          path: dist/win-thermalright-ai-monitor/
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-thermalright-ai-monitor-windows-x64
          path: release-package
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path release-package/* `
            -DestinationPath win-thermalright-ai-monitor-windows-x64.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: win-thermalright-ai-monitor-windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
