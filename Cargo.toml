[package]
name = "win-thermalright-ai-monitor"
version = "0.1.0"
edition = "2024"
description = "Windows Thermalright LCD system and AI agent dashboard"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
rusb = { version = "0.9", features = ["vendored"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tiny-skia = "0.11"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = "0.21"
winreg = "0.55"
wmi = "0.17"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Power", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
